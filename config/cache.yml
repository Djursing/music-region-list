default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  # Primary database, not a dedicated cache one — Railway gives us a single
  # Postgres instance. See config/database.yml.
  database: primary
  <<: *default
