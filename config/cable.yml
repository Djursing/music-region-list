# Development uses solid_cable rather than the async adapter, because async only
# delivers within a single process. Everything this app broadcasts — playlist
# import progress, the driving HUD — is broadcast from a job running in the
# separate `bin/jobs` process, so with the async adapter those updates are
# silently dropped and the page just sits there. Going through the database
# means development behaves the same way production does.
default: &default
  adapter: solid_cable
  # Primary database, not a dedicated cable one — Railway gives us a single
  # Postgres instance. See config/database.yml.
  connects_to:
    database:
      writing: primary
  polling_interval: 0.1.seconds
  message_retention: 1.day

development:
  <<: *default

test:
  adapter: test

production:
  <<: *default
